<title>Word Partners</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one calm column, like a textbook page; the collocation word is always "highlighted" in marker yellow. */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #e8ecf4;
  --fg: #19213a;
  --muted: #5b6480;
  --line: #d5dbe8;
  --accent: #2c55d8;
  --accent-fg: #ffffff;
  --mark: #ffe066;
  --mark-fg: #19213a;
  --good: #1f8a5b;
  --good-bg: #dff3e9;
  --bad: #c2392f;
  --bad-bg: #fbe3e0;
  --warn: #a86a00;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --surface: #1a2030; --surface-2: #232b3e; --fg: #e7ebf4; --muted: #9aa4bf;
    --line: #2e3850; --accent: #86a2ff; --accent-fg: #0e1426; --mark: rgba(255, 214, 64, .30); --mark-fg: #fff3c4;
    --good: #5fd39c; --good-bg: rgba(95, 211, 156, .14); --bad: #ff8a7f; --bad-bg: rgba(255, 138, 127, .14); --warn: #f2c14e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --surface: #1a2030; --surface-2: #232b3e; --fg: #e7ebf4; --muted: #9aa4bf;
  --line: #2e3850; --accent: #86a2ff; --accent-fg: #0e1426; --mark: rgba(255, 214, 64, .30); --mark-fg: #fff3c4;
  --good: #5fd39c; --good-bg: rgba(95, 211, 156, .14); --bad: #ff8a7f; --bad-bg: rgba(255, 138, 127, .14); --warn: #f2c14e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 6px; }
.brand .plus { color: var(--accent); }
nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); font: 700 .95rem var(--font-body); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
main { padding-block: 24px 64px; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.3rem); font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.3rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
mark, .hl { background: var(--mark); color: var(--mark-fg); padding: 0 .2em; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.gap { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--accent); height: 1.1em; vertical-align: baseline; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 700 1rem var(--font-body); padding: 11px 18px; border-radius: 10px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.icon-btn { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 6px; border-radius: 8px; display: inline-flex; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* Today */
.hero { display: grid; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .85rem; color: var(--muted); }
.cta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.cta > div { min-width: 0; }
.tip { border-left: 3px solid var(--mark); padding: 4px 0 4px 14px; }
.tip p + p { margin-top: 4px; }

.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.deck:hover { border-color: var(--accent); }
.deck h3 { font-size: 1.1rem; }
.deck .ex { font-size: .9rem; color: var(--muted); min-height: 2.6em; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .known { background: var(--good); }
.bar .learning { background: var(--accent); }
.deck .meta { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.lv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; font-variant-numeric: tabular-nums; }
.lv.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.lv .lvn { font-size: .8rem; }
.levelup { background: var(--good-bg); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.filters { gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 99px; padding: 5px 12px; font: 700 .9rem var(--font-body); cursor: pointer; }
.fchip span { color: var(--muted); font-weight: 400; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.fchip[aria-pressed="true"] span { color: inherit; opacity: .8; }
@media (max-width: 520px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* Deck list */
.back { border: 0; background: none; color: var(--accent); font: 700 .95rem var(--font-body); cursor: pointer; padding: 0; justify-self: start; }
.list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; border-top: 1px solid var(--line); }
.item:first-child, .lv-head + .item { border-top: 0; }
.lv-head { padding: 8px 16px; background: var(--surface-2); font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.item .ph { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.item .mn { color: var(--muted); font-size: .95rem; grid-column: 1; }
.item .eg { grid-column: 1; font-size: .98rem; }
.ru { color: var(--accent); font-size: .95em; }
.feedback .ru { display: block; }
.switch { gap: 8px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.item .rl { grid-column: 1; font-size: .95rem; color: var(--muted); }
.item .rl .label { margin-right: 4px; }
.item .side { grid-column: 2; grid-row: 1 / span 5; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.chip { font-size: .72rem; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip.new { background: var(--surface-2); color: var(--muted); }
.chip.learning { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.chip.known { background: var(--good-bg); color: var(--good); }
.lvl { font-size: .72rem; color: var(--muted); font-weight: 700; }

/* Flashcard */
.study-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { flex: 1 1 160px; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 36px); display: grid; gap: 18px; min-height: 300px; align-content: start; box-shadow: 0 10px 30px -18px rgba(25, 33, 58, .35); }
.card .meaning { font-size: 1.05rem; color: var(--muted); }
.card .sentence { font-size: clamp(1.25rem, 3.6vw, 1.6rem); line-height: 1.45; font-weight: 400; }
.card .answer { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 18px; }
.card .answer .big { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; line-height: 1.1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 10px 6px; font: 700 1rem var(--font-body); cursor: pointer; display: grid; gap: 2px; }
.rate button small { font-weight: 400; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate button:hover { border-color: var(--accent); }
.rate .again { color: var(--bad); }
.rate .good { color: var(--good); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.steps span.on { background: var(--accent); color: var(--accent-fg); }
.steps span.done { background: var(--good-bg); color: var(--good); }
.opt .k { display: inline-block; min-width: 1.4em; font-size: .8rem; color: var(--muted); font-weight: 400; }
.rate.rate3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.keys { font-size: .8rem; color: var(--muted); text-align: center; }

/* Quiz */
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 14px; font: 700 1.1rem var(--font-body); cursor: pointer; text-align: center; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.type-row input.in-ok { border-color: var(--good); color: var(--good); }
.type-row input.in-show { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.type-row { display: flex; gap: 10px; flex-wrap: wrap; }
.type-row input { flex: 1 1 200px; min-width: 0; font: 1.1rem var(--font-body); padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.feedback.ok { background: var(--good-bg); }
.feedback.no { background: var(--surface-2); }
.feedback .t { font-weight: 700; }
.feedback.ok .t { color: var(--good); }
.feedback.no .t { color: var(--fg); }
select { font: 1rem var(--font-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }
.score { font-family: var(--font-display); font-size: 3.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.missed { display: grid; gap: 8px; }

.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.settings > *, .settings .stack > * { min-width: 0; }
#voice { width: 100%; }
.confirm { background: var(--bad-bg); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
footer { font-size: .85rem; color: var(--muted); }

/* One-screen task layout: card fills the space, the button bar never moves */
body.task-mode { height: 100vh; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; overflow: hidden; }
body.task-mode { margin: 0; }
body.task-mode header.top { display: none; }
body.task-mode .card { gap: 14px; }
body.task-mode .card .answer { padding-top: 12px; gap: 4px; }
body.task-mode main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: 14px; padding-block: 14px; }
body.task-mode .study-head { flex: none; }
body.task-mode .card { flex: 1; min-height: 0; overflow-y: auto; box-shadow: none; }
.actions { flex: none; display: grid; grid-template-rows: 20px 58px 18px; gap: 6px; }
.actions .a-top { font-size: .85rem; color: var(--muted); text-align: center; margin: 0; }
.actions .a-row { display: flex; gap: 8px; min-width: 0; }
.actions .a-row > .btn { flex: 1 1 0; min-width: 0; height: 100%; padding: 0 10px; }
.actions .a-row > .rate { flex: 1; }
.actions .rate button { height: 58px; }
.actions .keys { margin: 0; }
@media (hover: none) { .actions .keys { visibility: hidden; } }
@media (max-width: 520px), (max-height: 760px) {
  body.task-mode .card { padding: 18px; gap: 12px; border-radius: 16px; }
  body.task-mode .card .sentence { font-size: 1.2rem; }
  body.task-mode .card .answer .big { font-size: 1.5rem; }
  body.task-mode .card .answer .muted { display: none; }
  body.task-mode .opt { padding: 10px; font-size: 1.02rem; }
  body.task-mode .options { gap: 8px; }
  body.task-mode .feedback { padding: 10px 14px; }
  body.task-mode .type-row input { padding: 10px 12px; }
}
@media (max-width: 520px) {
  .stats { gap: 8px; }
  .stat { padding: 12px; }
  .stat b { font-size: 1.5rem; }
  .rate { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .options { grid-template-columns: 1fr; }
  nav.tabs button { padding: 7px 10px; font-size: .9rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Word<span class="plus">+</span>Partners</div>
    <nav class="tabs" aria-label="Sections">
      <button id="tab-today" data-view="today">Today</button>
      <button id="tab-decks" data-view="decks">Words</button>
      <button id="tab-quiz" data-view="quiz">Quiz</button>
      <button id="tab-settings" data-view="settings">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
// Data format: deck | collocation | meaning | example with {answer} | real-life example | level | Russian translation
// Only correct collocations are stored: the app never shows wrong word pairs.
const RAW = `

const KEY = "word-partners-v1";
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.cards) return s; } catch (e) {}
  return { cards: {}, newPerDay: 10, log: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function dayNum(d = new Date()) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
const today = () => dayNum();

function rateCard(r) {

// ---------- quiz ----------
let quiz = null;
// Options are always real, correct collocations: the learner picks the one that matches the meaning.
// Collocations with very close meanings never appear together as options, so only one answer fits.
const SYN = [["do damage", "do harm"], ["have a good time", "have fun"], ["make progress", "make headway"], ["do research", "carry out research"],
  ["make money", "earn a living", "make a fortune"], ["make an effort", "do your best", "go to great lengths"], ["take into account", "bear in mind"],
  ["have an impact on", "make a difference"], ["pressed for time", "run out of time"], ["bitter disappointment", "bitterly disappointed"],
  ["cost a fortune", "break the bank", "high price"], ["get better", "make progress"], ["take part in", "attend a meeting"], ["serious problem", "grave concern"]];
const close = (a, b) => SYN.some(g => g.includes(a) && g.includes(b));
function pickOptions(it, pool) {
  const ok = i => i.id !== it.id && i.p !== it.p && !close(i.p, it.p);
  const same = shuffle(pool.filter(i => ok(i) && i.d === it.d));
  const other = shuffle(ITEMS.filter(i => ok(i) && i.d !== it.d));
  const picked = [];
  for (const i of same.concat(other)) { if (picked.length === 3) break; if (!picked.some(q => close(q.p, i.p))) picked.push(i); }
  return shuffle([it.p, ...picked.map(i => i.p)]);
}
function startQuiz(deck, lv) {
  const pool = ITEMS.filter(i => (!deck || i.d === deck) && (!lv || i.lv === lv));
  if (!pool.length) return;
  const qs = shuffle(pool).slice(0, 10).map((it, n) => ({
    id: it.id, type: n < 4 ? "pick" : "type", opts: pickOptions(it, pool), picked: null, ok: null, hint: false,
  }));
  quiz = { deck, lv, qs, i: 0 };
  go("quiz");
}

  if (quiz.i >= quiz.qs.length) {

    const missed = quiz.qs.filter(q => !q.ok).map(q => BY_ID[q.id]);

    return `<section class="card">

      ${missed.length ? `<div class="missed"><span class="label">${t("Practise these again")}</span>${missed.map(i => `<div><b>${esc(i.p)}</b> <span class="muted">· ${esc(i.m)}</span>${tr(i) ? ` · ${tr(i)}` : ""}<br>${marked(i)}</div>`).join("")}</div>` : ""}
      <div class="row"><button class="btn primary" data-act="quiz-again">${t("New quiz")}</button><button class="btn" data-act="quiz-change">${t("Change deck")}</button></div>
    </section>`;
  }
  const q = quiz.qs[quiz.i], it = BY_ID[q.id], answered = q.picked !== null;
  let body;
  if (q.type === "pick") {
    body = `<div class="options">${q.opts.map(o => {

    }).join("")}</div>`;
  } else {
    body = `<form class="type-row" id="type-form" autocomplete="off">

</form>`;
  }
  const fb = answered ? `<div class="feedback ${q.ok ? "ok" : "no"}">
      <span class="t">${q.ok ? t("Correct!") : q.type === "pick" ? t("The right collocation is marked in green.") : t("Here is the right collocation:")}</span>
      ${q.type === "pick" ? "" : `<span class="row" style="gap:4px"><b style="font-size:1.15rem">${esc(it.p)}</b> ${speakBtn(plain(it))}</span>`}

  const bar = answered ? actions("", `<button class="btn primary" data-act="quiz-next">${quiz.i === quiz.qs.length - 1 ? t("See result") : t("Next question")}</button>`, t("Keyboard: Enter"))
    : q.type === "pick" ? actions(t("Choose one answer above"), "", "")
    : actions(q.hint ? t("Hint: the first letter is shown in the box") : "", `<button class="btn primary" type="submit" form="type-form">${t("Check")}</button>${q.hint ? "" : `<button type="button" class="btn" data-act="hint">${t("Hint")}</button>`}<button type="button" class="btn" data-act="reveal">${t("Show answer")}</button>`, t("Keyboard: Enter to check"));
  return `<div class="study-head">
      <button class="back" data-act="quiz-change">← ${t("Stop")}</button>
      <div class="progress"><i style="width:${quiz.i / quiz.qs.length * 100}%"></i></div>
      <span class="muted" style="font-variant-numeric:tabular-nums">${quiz.i + 1} / ${quiz.qs.length}</span>
    </div>
    <article class="card">
      <span class="label">${q.type === "pick" ? t("Which collocation has this meaning?") : t("Write the missing word")}</span>
      ${q.type === "pick" ? `<p class="sentence">“${esc(it.m)}”</p>` : `<p class="meaning">${esc(it.m)}${tr(it) ? `<br>${tr(it)}` : ""}</p><p class="sentence">${answered ? marked(it) : gapped(it)}</p>`}
      ${body}
      ${fb}
    </article>
    ${bar}`;
}
function answer(val) {
  const q = quiz.qs[quiz.i], it = BY_ID[q.id];
  if (val === null) { q.picked = ""; q.ok = false; } else {
  q.picked = val.trim();
  const target = q.type === "pick" ? it.p : it.ans;
  q.ok = norm(q.picked) === norm(target);
  }
  if (!q.ok && S.cards[it.id]) { S.cards[it.id].due = today(); save(); }
  if (!q.ok && !S.cards[it.id]) { S.cards[it.id] = { iv: 0, ef: 2.5, reps: 0, lapses: 0, due: today() }; save(); }
  render();
  const n = document.querySelector('[data-act="quiz-next"]'); if (n) n.focus();
}

  if (lsel) lsel.onchange = () => { S.level = lsel.value; save(); };
  const sru = $("#show-ru");
  if (sru) sru.onchange = () => { S.showRu = sru.checked; save(); };
  const vsel = $("#voice");
  if (vsel) vsel.onchange = () => { S.voice = vsel.value; save(); say("Hello! This is my new voice."); };
  const rsel = $("#rate");
  if (rsel) rsel.onchange = () => { S.rate = +rsel.value; save(); say("I need to make a decision by Friday."); };
  const f = $("#type-form");
  const sf = $("#study-form");
  if (sf) { sf.onsubmit = e => { e.preventDefault(); const v = $("#study-input").value; if (v.trim()) studyCheck(v); }; const si = $("#study-input"); if (!si.disabled) si.focus(); }
  if (f) { f.onsubmit = e => { e.preventDefault(); const v = $("#type-input").value; if (v.trim()) answer(v); }; const inp = $("#type-input"); if (!inp.disabled) inp.focus(); }
}
document.addEventListener("click", e => {
  const bt = e.target.closest("button");
  if (!bt) return;
  if (bt.dataset.say) { say(bt.dataset.say); return; }
  if (bt.dataset.view) { if (bt.dataset.view === "quiz") quiz = null; go(bt.dataset.view); return; }
  if (bt.dataset.go) { if (bt.dataset.go === "quiz") quiz = null; bt.dataset.go === "deck" ? go("deck", { deck: bt.dataset.deck }) : go(bt.dataset.go); return; }
  if (bt.dataset.deck) { go("deck", { deck: bt.dataset.deck }); return; }
  if (bt.dataset.rate) { rateCard(+bt.dataset.rate); return; }
  if (bt.dataset.sopt !== undefined) { studyPick(bt.dataset.sopt); return; }
  if (bt.dataset.opt !== undefined) { answer(bt.dataset.opt); return; }
  const a = bt.dataset.act;
  if (a === "study-all") startStudy(null);
  else if (a === "study-deck") startStudy(ctx.deck, ctx.lvl);
  else if (a === "to-type") { sess.step = "type"; render(); }
  else if (a === "study-reveal") studyCheck(null);
  else if (a === "ui") { S.ui = bt.dataset.ui; save(); render(); }
  else if (a === "order") { S.order = bt.dataset.order; save(); render(); }
  else if (a === "level-up") { S.level = nextLevel(); save(); render(); }
  else if (a === "lvl-filter") { ctx.lvl = bt.dataset.lv || null; render(); }
  else if (a === "quiz-deck") startQuiz(ctx.deck, ctx.lvl);
  else if (a === "quiz-start") startQuiz($("#quiz-deck").value || null, $("#quiz-level").value || null);
  else if (a === "hint") { quiz.qs[quiz.i].hint = true; render(); }
  else if (a === "reveal") answer(null);
  else if (a === "quiz-next") { quiz.i++; render(); }
  else if (a === "quiz-again") startQuiz(quiz.deck, quiz.lv);
  else if (a === "quiz-change") { const d = quiz && quiz.deck, l = quiz ? quiz.lv || "" : undefined; quiz = null; go("quiz", { deck: d, lv: l }); }
  else if (a === "reset-ask") {
    $("#reset-area").innerHTML = `<div class="confirm"><b>${t("Delete all your progress?")}</b><span>${t("This cannot be undone.")}</span><div class="row"><button class="btn small" data-act="reset-yes">${t("Yes, reset")}</button><button class="btn small" data-act="reset-no">${t("Cancel")}</button></div></div>`;
  }
  else if (a === "reset-yes") { S = { cards: {}, newPerDay: S.newPerDay, log: {}, ui: S.ui, showRu: S.showRu, voice: S.voice, rate: S.rate, level: S.level, order: S.order }; save(); render(); }
  else if (a === "reset-no") render();
});
document.addEventListener("keydown", e => {
  if (view !== "study" || !sess || !sess.queue.length) return;
  if (e.target.matches("input, select, textarea")) return;
  if (sess.step === "pick" && sess.pickOk === null && ["1", "2", "3", "4"].includes(e.key)) studyPick(sess.opts[+e.key - 1]);
  else if (sess.step === "done" && sess.typeOk && ["1", "2", "3"].includes(e.key)) rateCard(+e.key);
});
if (SPEAK) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (view === "settings") { const y = scrollY; render(); scrollTo(0, y); } }; } catch (e) {} }
render();
</script>
